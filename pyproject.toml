[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cbct-clinical-reasoner"
version = "0.2.0"
description = "ToothFairy4 CBCT-to-report pipeline for ODIN 2026 Task 1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CBCT Clinical Reasoner Contributors" }]

# Inference-only dependencies. The submission container installs nothing else
# unless a neural checkpoint is bundled, which keeps the image small and the
# offline build reproducible.
dependencies = [
  "numpy>=1.26,<3",
  "SimpleITK>=2.3,<3",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "timm>=1.0",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
  "matplotlib>=3.8",
]
llm = [
  "transformers>=4.44",
  "accelerate>=0.33",
  "peft>=0.12",
  "datasets>=2.20",
  "sentencepiece>=0.2",
]
radfact = [
  "radfact-lite>=0.1.0",
  "openai>=1.0.0",
]
hub = [
  "huggingface-hub>=0.24",
]
cloud = [
  "modal>=1.0",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  # Used only to assert that the reimplemented BLEU-4 matches the grader.
  "nltk>=3.9,<4",
]
all = [
  "cbct-clinical-reasoner[train,llm,radfact,hub,cloud,dev]",
]

[project.scripts]
cbct-reasoner = "cbct_reasoner.cli:main"
toothfairy4-inference = "cbct_reasoner.grand_challenge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cbct_reasoner"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: exercises the full pipeline on synthetic data",
]

[tool.ruff]
# Generated by scripts/build_submission.py: one long line per clinical
# sentence, and reformatting it would only obscure what is shipped.
extend-exclude = ["submission/report_model.py"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# SIM905 rewrites readable multi-line word lists (stopwords, test vocabularies)
# into 20-element literals. The prose form is the point.
ignore = ["SIM905"]

[tool.ruff.lint.per-file-ignores]
# Metric ports intentionally mirror the grader's structure rather than idiomatic Python.
"src/cbct_reasoner/metrics/official.py" = ["E501"]
"tests/*" = ["E501"]
